# Render Blueprint — https://render.com/docs/blueprint-spec
#
# Chokepoint builds to fully static assets, so it deploys as a static site with
# no server and no runtime cost.
services:
  - type: web
    name: chokepoint
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: false

    envVars:
      # Match the version the app is built and verified against locally.
      - key: NODE_VERSION
        value: 24.15.0
      # The build needs Vite and TypeScript, which are devDependencies. Render
      # sets NODE_ENV=production, and npm would otherwise skip them entirely.
      - key: NPM_CONFIG_PRODUCTION
        value: "false"

    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      # Vite fingerprints everything under /assets, so it can be cached hard.
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable

    routes:
      # Single page app: anything that is not a real file falls back to the
      # entry document rather than 404ing.
      - type: rewrite
        source: /*
        destination: /index.html
